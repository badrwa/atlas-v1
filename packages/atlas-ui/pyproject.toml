[project]
name = "atlas-ui"
version = "0.1.0"
description = "Atlas orb UI: event bridge, WebSocket protocol and pywebview window (L5)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "atlas-core",
]

[project.optional-dependencies]
orb = ["pywebview>=5.0", "fastapi>=0.111", "uvicorn>=0.30", "pystray>=0.19", "keyboard>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_ui"]
