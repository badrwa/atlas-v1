[project]
name = "atlas-core"
version = "0.1.0"
description = "Atlas kernel: contracts, DI, event bus, interaction FSM, resource leases, config, timings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_core"]
