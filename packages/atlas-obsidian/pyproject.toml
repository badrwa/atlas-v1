[project]
name = "atlas-obsidian"
version = "0.1.0"
description = "Atlas second brain: Obsidian vault adapter, folder contract, git journal, FTS5 index"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "atlas-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_obsidian"]
