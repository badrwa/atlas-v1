[project]
name = "atlas-mind"
version = "0.1.0"
description = "Atlas brain: LLM providers, fallback router, language/dialect routing, persona, context"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "atlas-core",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_mind"]
