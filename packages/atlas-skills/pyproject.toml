[project]
name = "atlas-skills"
version = "0.1.0"
description = "Atlas hands: skill registry, permission model, Windows/system/web/notes skills"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "atlas-core",
]

[project.optional-dependencies]
windows = ["psutil>=5.9", "pywin32>=306", "pycaw>=20240210"]
web = ["httpx>=0.27", "ddgs>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_skills"]
