[project]
name = "atlas-audio"
version = "0.1.0"
description = "Atlas ears and mouth: wake word, VAD, Darija/English ASR, Piper + DarijaTTS synthesis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "atlas-core",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "webrtcvad-wheels>=2.0.14",
]
local = [
    "faster-whisper>=1.0",
    "onnxruntime>=1.18",
    "piper-tts>=1.2",
]
all = ["atlas-audio[audio,local]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_audio"]
