[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-app"
version = "0.1.0"
description = "ATLAS command line — doctor, providers, chat, vault, skills (L0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "atlas-core",
    "atlas-mind",
    "atlas-obsidian",
    "atlas-skills",
    "atlas-audio",
    "atlas-ui",
    "httpx>=0.27",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]
