name: ci

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep output stable and readable in a hardware-constrained project.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install workspace (editable) + dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e packages/atlas-core \
            -e packages/atlas-mind \
            -e packages/atlas-obsidian \
            -e packages/atlas-skills \
            -e packages/atlas-audio \
            -e packages/atlas-ui \
            -e apps/atlas
          python -m pip install "pytest>=8.2" "pytest-asyncio>=0.23" "ruff>=0.5" "mypy>=1.10"

      # These two guard the architecture, not just the code style: the core
      # must never depend on a package that drags PyTorch in, and lower layers
      # must never import higher ones.  Run them first — they fail fastest.
      - name: Architecture rules
        run: |
          python scripts/check_import_rules.py
          python scripts/check_no_torch.py

      - name: Lint (ruff)
        run: ruff check packages apps scripts

      - name: Types (mypy)
        run: mypy packages apps

      - name: Tests (pytest)
        run: pytest

  # Windows is the target OS, so the kernel is exercised there too — cheap
  # insurance against POSIX-only assumptions creeping into Atlas.
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install workspace (editable)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/atlas-core -e packages/atlas-mind -e packages/atlas-obsidian -e packages/atlas-skills -e packages/atlas-audio -e packages/atlas-ui -e apps/atlas
          python -m pip install "pytest>=8.2" "pytest-asyncio>=0.23"
      - name: Tests (pytest)
        run: pytest
